# systemd drop-in for the Reachy Mini Wireless.
# Copy to /etc/systemd/system/reachy-mini-daemon.service.d/local-brain.conf on the robot,
# replace <your-mac-name>, then run:
#   sudo systemctl daemon-reload
#   sudo systemctl restart reachy-mini-daemon
[Service]
Environment=HF_REALTIME_CONNECTION_MODE=local
Environment=HF_REALTIME_WS_URL=ws://<your-mac-name>.local:8765/v1
