# systemd drop-in for the Reachy Mini Wireless.
# Loads the persona from a folder outside the conversation app, so app updates do not overwrite it.
# Copy the files in profiles/Rose-example/ to /home/pollen/profiles/<RobotName>/ on the robot,
# copy this file to /etc/systemd/system/reachy-mini-daemon.service.d/profile.conf,
# replace <RobotName>, then daemon-reload and restart as in local-brain.conf.
[Service]
Environment=REACHY_MINI_EXTERNAL_PROFILES_DIRECTORY=/home/pollen/profiles
Environment=REACHY_MINI_CUSTOM_PROFILE=<RobotName>
